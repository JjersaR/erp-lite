services:
  # PostgreSQL - Transactional database (Orders, Products)
  postgres:
    image: postgres:17
    container_name: erp-postgres
    environment:
      POSTGRES_DB: erp_db
      POSTGRES_USER: jersa
      POSTGRES_PASSWORD: jersaBP56
    ports:
      - "5432:5432"
    volumes:
      - ./db/postgresql:/docker-entrypoint-initdb.d
    networks:
      - erp-vpc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jersa -d erp_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB - Document database (Catalogs, AuditLogs, Product Queries)
  mongodb:
    image: mongo:7.0
    container_name: erp-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: jersa
      MONGO_INITDB_ROOT_PASSWORD: jersaBP56
      MONGO_INITDB_DATABASE: erp_catalog_db
    ports:
      - "27017:27017"
    volumes:
      - ./db/mongodb:/docker-entrypoint-initdb.d
    networks:
      - erp-vpc
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "-u", "jersa", "-p", "jersaBP56", "--authenticationDatabase", "admin", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Redis - Catalog cache
  redis:
    image: redis:7
    container_name: erp-redis
    command: redis-server --requirepass jersaBP56 --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    networks:
      - erp-vpc
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "jersaBP56", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: always
    container_name: redis-ui
    environment:
      - REDIS_HOSTS=local:redis:6379:0:jersaBP56
      - HTTP_USER=jersa
      - HTTP_PASSWORD=jersaBP56
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - erp-vpc
  # LocalStack - AWS services emulation
  localstack:
    image: localstack/localstack:3.8.1
    container_name: erp-localstack
    environment:
      - SERVICES=s3
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=jersa
      - AWS_SECRET_ACCESS_KEY=jersaBP56
    ports:
      - "4566:4566"            # LocalStack edge port
      - "4510-4559:4510-4559"  # External services port range
    networks:
      - erp-vpc
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  erp-vpc:
    driver: bridge
